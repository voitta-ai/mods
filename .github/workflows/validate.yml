name: validate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace and every mod
        run: |
          claude plugin validate .
          for manifest in */.claude-plugin/plugin.json; do
            claude plugin validate "${manifest%/.claude-plugin/plugin.json}"
          done
